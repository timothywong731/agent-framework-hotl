[project]
name = "hotl-demo"
version = "0.1.0"
description = "Human-on-the-loop pipeline demo on Microsoft Agent Framework"
requires-python = ">=3.10,<3.14"
dependencies = [
    "agent-framework (~=1.11)",
    "agent-framework-ollama (==1.0.0b260709)",
    "pypdf (>=5,<7)",
    "fpdf2 (>=2.8,<3)",
    "jinja2 (>=3.1,<3.2)",
    "pyyaml (>=6.0,<6.1)",
]

[project.scripts]
demo = "hotl_demo.main:run"
reflexion = "reflexion_demo.main:run"
reflection = "reflection_demo.main:run"

[tool.poetry]
packages = [
    { include = "hotl_demo", from = "src" },
    { include = "reflexion_demo", from = "src" },
    { include = "reflection_demo", from = "src" },
]

[tool.poetry.group.dev.dependencies]
pytest = "~=8.3"
pytest-asyncio = "^1.4.0"
pymarkdownlnt = "^0.9.39"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ollama: live end-to-end test requiring a running Ollama server"]
addopts = "-m 'not ollama'"
asyncio_mode = "auto"
